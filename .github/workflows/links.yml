name: Check links

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external and internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --timeout 40
            --max-retries 2
            --retry-wait-time 5
            --accept 200,206,403,429
            --exclude-path private
            --exclude '^http://10\.'
            --exclude 'example\.com'
            --exclude 'gov\.co'
            --exclude 'h2hc\.com\.br'
            --exclude 'crypto\.stanford\.edu'
            --exclude 'pentest-standard\.org'
            "**/*.md"
          fail: true
